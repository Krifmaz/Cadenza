# Cadenza CI: tests + clippy on Linux (ALSA), build-only on macOS (CoreAudio hog mode)
# and Windows (WASAPI exclusive). Runs on pull requests and by hand – never on plain
# pushes, to save minutes.
name: CI

on:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux:
    name: Linux · test + clippy (alsa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: System libraries (ALSA, PipeWire, Mesa software Vulkan for the wgpu kernels)
        run: >
          sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config mesa-vulkan-drivers
          libpipewire-0.3-dev libspa-0.2-dev clang libclang-dev
          pipewire pipewire-bin wireplumber dbus
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features alsa,pipewire -- -D warnings
      - name: Clippy (cuda + wgpu)
        run: cargo clippy --workspace --all-targets --features alsa,pipewire,cuda,wgpu -- -D warnings
      - name: Test
        # the filter speed tests (limit::) time the filters, so they run on their own below: next to the
        # other tests on a 4-core runner the shortest filter measured "too slow" and the ladder test failed
        run: "cargo test --release --workspace --features alsa -- --skip limit::"
      - name: Test the filter speed checks (one at a time, nothing else running)
        run: "cargo test --release -p cadenza --features alsa --lib limit:: -- --test-threads=1"
      - name: Test the system input against a real (headless) PipeWire
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d) && chmod 700 "$XDG_RUNTIME_DIR"
          dbus-daemon --session --address=unix:path=$XDG_RUNTIME_DIR/bus --fork
          export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus
          pipewire & sleep 1
          wireplumber & sleep 2
          test -S "$XDG_RUNTIME_DIR/pipewire-0"
          cargo test --release -p cadenza --features alsa,pipewire --lib -- system::
      - name: Test with wgpu on software Vulkan (lavapipe)
        env:
          CADENZA_WGPU_SOFTWARE: "1"
        run: |
          cargo test --release --workspace --features alsa,wgpu
          cargo test --release -p cadenza-dsp --features wgpu -- --ignored wgpu_backend
      - name: Build with CUDA feature (no toolkit needed)
        run: cargo build --release --features cuda

  macos:
    name: macOS · build (coreaudio)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --features coreaudio,wgpu,tap
      - name: Unit tests (output + endpoint, no device needed)
        run: "cargo test --release -p cadenza --features coreaudio,tap --lib -- output:: endpoint:: system::"

  windows:
    name: Windows · build (wasapi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --features wasapi,asio,wgpu,loopback
      - name: Device listing (no audio device on the runner)
        run: cargo run --release --features wasapi,asio -- devices
      - name: Unit tests (output + endpoint, no device needed)
        run: "cargo test --release -p cadenza --features wasapi,asio,loopback --lib -- --test-threads=1 --nocapture output:: endpoint:: system::"
