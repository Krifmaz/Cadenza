# Cadenza releases: on a `v*` tag (or a manual run with a version), build the `cadenza` binary for Linux x86_64
# (alsa + cuda + wgpu) and aarch64 (alsa + wgpu) on Ubuntu 22.04 (glibc 2.35: runs on Debian bookworm / trixie and newer)
# and publish a GitHub release with one tar.gz per architecture plus SHA256SUMS.
# Encore's "Download tools" fetches the tar.gz files for server-side processing (`cadenza render`).
# Hotfixes: hotfix.yml calls this file with channel = hotfix on every push to main: the same tar.gz files as version
# <crate version>.<run number> (3.0.6.17; the binary keeps reporting the crate version), published as a normal release
# tagged hotfix-<version> that becomes "Latest" (Encore's plugin download only takes v<version> tags, so it keeps
# taking full releases). Only the
# newest three hotfixes are kept.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match the crate version, e.g. 2.2.0)"
        required: true
  workflow_call:
    inputs:
      channel:
        type: string
        required: false
        default: stable

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            features: alsa,cuda,wgpu
          - arch: aarch64
            # native arm64 runner (same Ubuntu 22.04 image, so the same glibc)
            runner: ubuntu-22.04-arm
            features: alsa,wgpu
    runs-on: ${{ matrix.runner }}
    # both architectures compute the same version and tag
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries (ALSA)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}
      - name: Version
        id: ver
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="cadenza"))')
          if [ "$CHANNEL" = hotfix ]; then
            # a hotfix: the crate version with the run number as a fourth part
            ver="$crate.$GITHUB_RUN_NUMBER"
          else
            ver="${{ inputs.version || github.ref_name }}"
            ver="${ver#v}"
            if [ "$ver" != "$crate" ]; then
              echo "version $ver does not match the crate version $crate" >&2
              exit 1
            fi
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "crate=$crate" >> "$GITHUB_OUTPUT"
          if [ "$CHANNEL" = hotfix ]; then echo "tag=hotfix-$ver" >> "$GITHUB_OUTPUT"; else echo "tag=v$ver" >> "$GITHUB_OUTPUT"; fi
      - name: Build
        run: cargo build --release --locked -p cadenza --bin cadenza --features ${{ matrix.features }}
      - name: Check the binary
        shell: bash
        run: |
          ./target/release/cadenza render --describe
          ./target/release/cadenza render --describe | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["protocol"]==1 and d["version"]=="${{ steps.ver.outputs.crate }}", d'
          objdump -T target/release/cadenza | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - name: Package
        shell: bash
        run: |
          name="cadenza-${{ steps.ver.outputs.ver }}-linux-${{ matrix.arch }}.tar.gz"
          mkdir -p dist
          strip target/release/cadenza
          tar -C target/release -czf "dist/$name" cadenza
          tar -tzf "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: cadenza-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          ls -la
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Cadenza ${{ inputs.channel == 'hotfix' && format('{0} (hotfix)', needs.build.outputs.ver) || needs.build.outputs.tag }}
          generate_release_notes: true
          prerelease: false
          make_latest: 'true'
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
      # a hotfix: only the newest three hotfix releases (and their tags) stay
      - name: Keep only the newest three hotfixes
        if: inputs.channel == 'hotfix'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: 3
        run: |
          OLD=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' \
                | sed -n 's/^hotfix-\([0-9]*\.[0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n -r | tail -n +$((KEEP + 1)))
          for v in $OLD; do echo "deleting hotfix-$v"; gh release delete "hotfix-$v" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true; done
