# Cadenza releases: on a `v*` tag (or a manual run with a version), build the `cadenza` binary for Linux x86_64
# (alsa + cuda + wgpu) and aarch64 (alsa + wgpu) on Ubuntu 22.04 (glibc 2.35: runs on Debian bookworm / trixie and newer)
# and publish a GitHub release with one tar.gz per architecture plus SHA256SUMS, together with the desktop app
# (one archive per OS) and its installers: Omnistall (github.com/Krifmaz/Omnistall) with Cadenza's manifest
# (packaging/omnistall/cadenza.toml) stamped in, one CadenzaSetup per OS.
# Encore's "Download tools" fetches the tar.gz files for server-side processing (`cadenza render`).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match the crate version, e.g. 2.2.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            features: alsa,cuda,wgpu
          - arch: aarch64
            # native arm64 runner (same Ubuntu 22.04 image, so the same glibc)
            runner: ubuntu-22.04-arm
            features: alsa,wgpu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries (ALSA)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}
      - name: Version
        id: ver
        shell: bash
        run: |
          ver="${{ inputs.version || github.ref_name }}"
          ver="${ver#v}"
          crate=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="cadenza"))')
          if [ "$ver" != "$crate" ]; then
            echo "version $ver does not match the crate version $crate" >&2
            exit 1
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
      - name: Build
        run: cargo build --release --locked -p cadenza --bin cadenza --features ${{ matrix.features }}
      - name: Check the binary
        shell: bash
        run: |
          ./target/release/cadenza render --describe
          ./target/release/cadenza render --describe | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["protocol"]==1 and d["version"]=="${{ steps.ver.outputs.ver }}", d'
          objdump -T target/release/cadenza | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - name: Package
        shell: bash
        run: |
          name="cadenza-${{ steps.ver.outputs.ver }}-linux-${{ matrix.arch }}.tar.gz"
          mkdir -p dist
          strip target/release/cadenza
          tar -C target/release -czf "dist/$name" cadenza
          tar -tzf "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: cadenza-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  desktop:
    # The desktop app as a plain archive per OS: what the CadenzaSetup installers download.
    name: Desktop app ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
            features: alsa,wgpu
          - os: windows
            runner: windows-latest
            features: wasapi,asio,loopback,wgpu
          - os: macos
            runner: macos-latest
            features: coreaudio,tap,wgpu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries (GTK for the tray, ALSA)
        if: matrix.os == 'linux'
        run: >
          sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
          libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-iced-${{ matrix.os }}
      - name: Version
        id: ver
        shell: bash
        run: |
          ver="${{ inputs.version || github.ref_name }}"
          echo "ver=${ver#v}" >> "$GITHUB_OUTPUT"
      - name: Build the app
        run: cargo build --release --locked -p cadenza-desktop --features ${{ matrix.features }}
      - name: Archive (Linux)
        if: matrix.os == 'linux'
        run: |
          set -eux
          mkdir -p dist/Cadenza
          strip target/release/cadenza-desktop
          cp target/release/cadenza-desktop dist/Cadenza/
          cp crates/cadenza-desktop/icons/128x128.png dist/Cadenza/cadenza.png
          tar -C dist -czf "dist/Cadenza-Desktop-${{ steps.ver.outputs.ver }}-linux-x86_64.tar.gz" Cadenza
          rm -rf dist/Cadenza
      - name: Archive (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/cadenza-desktop.exe dist/Cadenza.exe
          Compress-Archive -Path dist/Cadenza.exe -DestinationPath "dist/Cadenza-Desktop-${{ steps.ver.outputs.ver }}-windows-x86_64.zip"
          Remove-Item dist/Cadenza.exe
      - name: Archive (macOS)
        if: matrix.os == 'macos'
        run: |
          set -eux
          cargo install cargo-packager --version 0.11.8 --locked
          (cd crates/cadenza-desktop && cargo packager --release --formats app)
          # Apple Silicon refuses unsigned bundles: sign ad hoc (no Developer ID here).
          codesign --force --deep --sign - target/release/bundle/Cadenza.app
          mkdir -p dist
          tar -C target/release/bundle -czf "dist/Cadenza-Desktop-${{ steps.ver.outputs.ver }}-macos-aarch64.tar.gz" Cadenza.app
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  setup:
    # CadenzaSetup: the Omnistall installer with Cadenza's manifest inside, per OS.
    name: CadenzaSetup ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
          - os: windows
            runner: windows-latest
          - os: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Krifmaz/Omnistall
          path: omnistall
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: omnistall
          key: omnistall-${{ matrix.os }}
      - name: The manifest for this version
        shell: bash
        run: |
          ver="${{ inputs.version || github.ref_name }}"
          ver="${ver#v}"
          py=$(command -v python3 || command -v python)
          "$py" - "$ver" <<'EOF'
          import re, sys
          src = open("packaging/omnistall/cadenza.toml").read()
          out = re.sub(r'(?m)^version = ".*"$', f'version = "{sys.argv[1]}"', src, count=1)
          open("cadenza.toml", "w").write(out)
          EOF
          grep -m1 '^version' cadenza.toml
          mkdir -p dist
      - name: Linux (AppImage)
        if: matrix.os == 'linux'
        working-directory: omnistall
        run: |
          set -eux
          sudo apt-get update && sudo apt-get install -y libfuse2 file
          cargo build --release --locked -p installer-gui
          cargo xtask validate ../cadenza.toml
          cargo xtask appdir --binary target/release/omnistall --out ../Cadenza.AppDir --manifest ../cadenza.toml
          curl -sSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run ../Cadenza.AppDir ../dist/CadenzaSetup-linux-x86_64.AppImage
      - name: Windows (.exe)
        if: matrix.os == 'windows'
        working-directory: omnistall
        shell: pwsh
        run: |
          cargo build --release --locked -p installer-gui
          cargo xtask brand --installer target/release/omnistall.exe --manifest ../cadenza.toml --out ../dist/CadenzaSetup-windows-x86_64.exe
      - name: macOS (.dmg)
        if: matrix.os == 'macos'
        working-directory: omnistall
        run: |
          set -eux
          cargo build --release --locked -p installer-gui --target aarch64-apple-darwin
          cargo build --release --locked -p installer-gui --target x86_64-apple-darwin
          lipo -create -output omnistall-universal \
            target/aarch64-apple-darwin/release/omnistall target/x86_64-apple-darwin/release/omnistall
          ver=$(grep -m1 '^version' ../cadenza.toml | cut -d'"' -f2)
          cargo xtask app-bundle --binary omnistall-universal --out "../Cadenza Setup.app" --version "$ver" --manifest ../cadenza.toml
          codesign --force --deep --sign - "../Cadenza Setup.app"
          rm -rf ../dmg-root && mkdir ../dmg-root
          cp -R "../Cadenza Setup.app" ../dmg-root/
          hdiutil create -volname "Cadenza Setup" -srcfolder ../dmg-root -ov -format UDZO ../dist/CadenzaSetup-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: setup-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish
    needs: [build, desktop, setup]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          ls -la
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Cadenza ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/CadenzaSetup-*
            dist/SHA256SUMS
