# Cadenza releases: on a `v*` tag (or a manual run with a version), build the `cadenza` binary for Linux x86_64
# (alsa + cuda + wgpu) and aarch64 (alsa + wgpu) on Ubuntu 22.04 (glibc 2.35: runs on Debian bookworm / trixie and newer)
# and publish a GitHub release with one tar.gz per architecture plus SHA256SUMS, together with the desktop app's
# installers (Linux .deb / .AppImage, Windows .exe / .msi, macOS .dmg).
# Encore's "Download tools" fetches the tar.gz files for server-side processing (`cadenza render`).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match the crate version, e.g. 2.2.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            features: alsa,cuda,wgpu
          - arch: aarch64
            # native arm64 runner (same Ubuntu 22.04 image, so the same glibc)
            runner: ubuntu-22.04-arm
            features: alsa,wgpu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries (ALSA)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}
      - name: Version
        id: ver
        shell: bash
        run: |
          ver="${{ inputs.version || github.ref_name }}"
          ver="${ver#v}"
          crate=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="cadenza"))')
          if [ "$ver" != "$crate" ]; then
            echo "version $ver does not match the crate version $crate" >&2
            exit 1
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
      - name: Build
        run: cargo build --release --locked -p cadenza --bin cadenza --features ${{ matrix.features }}
      - name: Check the binary
        shell: bash
        run: |
          ./target/release/cadenza render --describe
          ./target/release/cadenza render --describe | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["protocol"]==1 and d["version"]=="${{ steps.ver.outputs.ver }}", d'
          objdump -T target/release/cadenza | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - name: Package
        shell: bash
        run: |
          name="cadenza-${{ steps.ver.outputs.ver }}-linux-${{ matrix.arch }}.tar.gz"
          mkdir -p dist
          strip target/release/cadenza
          tar -C target/release -czf "dist/$name" cadenza
          tar -tzf "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: cadenza-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  desktop:
    name: Desktop app ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
            features: alsa,wgpu
            formats: deb,appimage
            files: |
              target/release/bundle/*.deb
              target/release/bundle/*.AppImage
          - os: windows
            runner: windows-latest
            features: wasapi,asio,loopback,wgpu
            formats: nsis,wix
            files: |
              target/release/bundle/*.exe
              target/release/bundle/*.msi
          - os: macos
            runner: macos-latest
            features: coreaudio,tap,wgpu
            formats: dmg
            files: |
              target/release/bundle/*.dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries (GTK for the tray, ALSA)
        if: matrix.os == 'linux'
        run: >
          sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
          libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libxkbcommon-dev file
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-iced-${{ matrix.os }}
      - name: Build the app
        run: cargo build --release --locked -p cadenza-desktop --features ${{ matrix.features }}
      - name: cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build the installers
        working-directory: crates/cadenza-desktop
        run: cargo packager --release --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish
    needs: [build, desktop]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          # The desktop installers arrive in per-format folders (deb/, msi/, …): flatten.
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete
          ls -la
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Cadenza ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
            dist/*.exe
            dist/*.msi
            dist/*.dmg
            dist/SHA256SUMS
