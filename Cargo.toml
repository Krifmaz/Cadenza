[workspace]
resolver = "2"
members = ["crates/cadenza-dsp", "crates/cadenza"]

[workspace.package]
version = "2.4.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Krifmaz/cadenza"
authors = ["Cadenza contributors"]
rust-version = "1.85"

[workspace.dependencies]
rustfft = "6.2"
realfft = "3.4"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
dirs = "6"
rayon = "1.12"

# Long multi-million-tap filter designs and the FFT heavy lifting are much nicer
# with optimisations on, even while running the test-suite.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
