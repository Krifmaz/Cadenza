[workspace]
resolver = "2"
members = ["crates/cadenza-eq", "crates/cadenza-dsp", "crates/cadenza"]

[workspace.package]
version = "3.0.6"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Krifmaz/cadenza"
authors = ["Cadenza contributors"]
rust-version = "1.85"

[workspace.dependencies]
rustfft = "6.2"
realfft = "3.4"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
dirs = "6"
rayon = "1.12"

# Long multi-million-tap filter designs and the FFT heavy lifting are much nicer
# with optimisations on, even while running the test-suite.
# Lints on top of clippy's defaults that catch wasted copies: a String or Vec copied with to_string/to_owned
# where clone (or nothing) would do, and to_string through an extra reference (the slow, generic path).
# CI runs clippy with -D warnings, so they cannot creep back in. redundant_clone and needless_collect are
# nursery lints with false positives, so they are run by hand now and then instead.
[workspace.lints.clippy]
implicit_clone = "warn"
inefficient_to_string = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
