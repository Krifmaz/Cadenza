[package]
name = "cadenza-desktop"
description = "Cadenza as a desktop app: the engine with a native window (iced), a tray and media keys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "cadenza-desktop"
path = "src/main.rs"

[features]
default = ["cpal"]
# The engine's backends and offloads, passed through (see the cadenza crate).
cpal = ["cadenza/cpal"]
alsa = ["cadenza/alsa"]
wasapi = ["cadenza/wasapi"]
asio = ["cadenza/asio"]
coreaudio = ["cadenza/coreaudio"]
cuda = ["cadenza/cuda"]
wgpu = ["cadenza/wgpu"]
pipewire = ["cadenza/pipewire"]
loopback = ["cadenza/loopback"]
tap = ["cadenza/tap"]

[dependencies]
cadenza = { path = "../cadenza", default-features = false }
cadenza-dsp = { path = "../cadenza-dsp" }
iced = { version = "0.14", features = ["canvas", "image", "tokio", "svg"] }
tray-icon = "0.21"
raw-window-handle = "0.6"
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros"] }
ureq = { version = "2", features = ["json"] }
serde = { workspace = true }
serde_json.workspace = true
log.workspace = true
env_logger = "0.11"
dirs.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Installers (`cargo packager --release` after `cargo build --release -p cadenza-desktop`).
[package.metadata.packager]
product-name = "Cadenza"
identifier = "app.cadenza.desktop"
category = "Music"
description = "High-end upsampling audio engine"
long-description = "Cadenza: an open-source upsampling engine for your DAC – long sinc filters, noise shaping, DSD modulators, room correction – in its own native window, with a tray and media keys."
publisher = "Cadenza contributors"
out-dir = "../../target/release/bundle"
binaries-dir = "../../target/release"
binaries = [{ path = "cadenza-desktop", main = true }]
icons = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.icns", "icons/icon.ico"]

[package.metadata.packager.deb]
depends = ["libxkbcommon-x11-0", "libgtk-3-0", "libayatana-appindicator3-1"]

[package.metadata.packager.nsis]
installer-mode = "currentUser"

[package.metadata.packager.macos]
minimum-system-version = "10.15"
