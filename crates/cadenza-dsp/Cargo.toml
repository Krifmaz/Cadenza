[package]
name = "cadenza-dsp"
description = "64-bit audio DSP for Cadenza: long FIR design, FFT resampling, dither and noise shaping, convolution, parametric EQ"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
# CUDA offload of the partitioned convolution (64-bit) through `cudarc` with dynamic
# loading: building needs no CUDA toolkit, and the binary runs without a GPU (it detects
# the driver at run time and falls back to the CPU). Pinned to the CUDA 12.5 driver API,
# which every NVIDIA driver >= 525 provides.
cuda = ["dep:cudarc", "dep:libloading"]

[dependencies]
rustfft.workspace = true
realfft.workspace = true
hound.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
dirs.workspace = true
rayon.workspace = true
cudarc = { version = "0.19.10", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12050"] }
libloading = { version = "0.9", optional = true }
