[package]
name = "cadenza-dsp"
description = "64-bit audio DSP for Cadenza: long FIR design, FFT resampling, dither and noise shaping, convolution, parametric EQ"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
# CUDA offload of the partitioned convolution (64-bit) through `cudarc` with dynamic
# loading: building needs no CUDA toolkit, and the binary runs without a GPU (it detects
# the driver at run time and falls back to the CPU). Pinned to the CUDA 12.5 driver API,
# which every NVIDIA driver >= 525 provides.
cuda = ["dep:cudarc", "dep:libloading"]
# Portable GPU offload through `wgpu` (Vulkan on Linux/Windows/Android, Metal on macOS,
# DX12 on Windows): AMD, Intel, Apple Silicon and NVIDIA cards. Native f64 where the card
# has it, double-f32 (two f32 per value, about 48 bits) elsewhere. Needs Rust 1.87.
wgpu = ["dep:wgpu", "dep:pollster", "dep:naga"]

[lints]
workspace = true

[dependencies]
rustfft.workspace = true
realfft.workspace = true
hound.workspace = true
cadenza-eq = { path = "../cadenza-eq", version = "3.0.6" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
dirs.workspace = true
rayon.workspace = true
cudarc = { version = "0.19.10", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12050"] }
libloading = { version = "0.9", optional = true }
wgpu = { version = "30", optional = true, default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "metal", "dx12"] }
naga = { version = "30", optional = true, features = ["wgsl-in", "spv-out", "msl-out", "hlsl-out"] }
pollster = { version = "1", optional = true }
