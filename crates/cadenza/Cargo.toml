[package]
name = "cadenza"
description = "Cadenza: an open-source bit-perfect / upsampling music playback engine with a control API, a web UI and Encore integration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
default-run = "cadenza"

[[bin]]
name = "cadenza"
path = "src/main.rs"

[features]
default = ["cpal"]
# Shared-mode output through the OS mixer on every platform.
cpal = ["dep:cpal"]
# Direct `hw:` ALSA devices (Linux): exclusive, exact rate and format.
alsa = ["dep:alsa"]
# WASAPI exclusive mode (Windows only; the crate is only compiled there).
wasapi = ["dep:wasapi"]
# ASIO drivers (Windows only): our own runtime loader, no Steinberg SDK; native DSD.
asio = ["dep:windows-sys"]
# CoreAudio hog mode / integer mode (macOS only; the crate is only compiled there).
coreaudio = ["dep:coreaudio-sys"]
# System-wide input on Linux: a PipeWire virtual sink or one app's audio
# (needs libpipewire-0.3-dev and clang to build).
pipewire = ["dep:pipewire"]
# CUDA offload in cadenza-dsp (NVIDIA driver >= 525 at run time, no toolkit to build).
cuda = ["cadenza-dsp/cuda"]
# Portable GPU offload in cadenza-dsp: Vulkan / Metal / DX12 (AMD, Intel, Apple, NVIDIA).
wgpu = ["cadenza-dsp/wgpu"]

[dependencies]
cadenza-dsp = { path = "../cadenza-dsp" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
log.workspace = true
dirs.workspace = true
hound.workspace = true
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
symphonia = { version = "0.5", features = ["all"] }
ureq = { version = "2", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
axum = { version = "0.8", features = ["json", "query"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
gethostname = "1"
cpal = { version = "0.15", optional = true }
# Endpoint discovery (`_cadenza-endpoint._tcp`).
mdns-sd = "0.13"
# UPnP renderer: SSDP socket options and the interface list.
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.13"
rsa = "0.9"
sha1 = "0.10"
aes = "0.8"
cbc = "0.1"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
alsa = { version = "0.9", optional = true }
pipewire = { version = "0.10.1", optional = true, features = ["v0_3_44"] }

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
wasapi = { version = "0.26", optional = true }

[dev-dependencies]
tempfile = "3"
