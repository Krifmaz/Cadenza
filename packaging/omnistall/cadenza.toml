# Omnistall manifest for the Cadenza desktop app (https://github.com/Krifmaz/Omnistall).
# The release workflow sets `version`, stamps this into an Omnistall build per OS and
# publishes those as CadenzaSetup-*: one double-click installs (or updates, repairs,
# uninstalls) Cadenza from the release's archives, checked against SHA256SUMS.
schema = 1

[app]
name = "cadenza"
display_name = "Cadenza"
version = "3.0.0"
description = "High-end upsampling audio engine for your DAC: long filters, noise shaping, DSD, room correction and EQ, with its own player and library."
publisher = "Cadenza contributors"
homepage = "https://github.com/Krifmaz/Cadenza"
license = "MIT OR Apache-2.0"
icon = "https://raw.githubusercontent.com/Krifmaz/Cadenza/main/crates/cadenza-desktop/icons/128x128.png"
kind = "gui"

[sources.linux-x86_64]
type = "github"
repo = "Krifmaz/Cadenza"
asset = "Cadenza-Desktop-{version}-linux-x86_64.tar.gz"
checksum_asset = "SHA256SUMS"
strip_components = 1

[sources.windows-x86_64]
type = "github"
repo = "Krifmaz/Cadenza"
asset = "Cadenza-Desktop-{version}-windows-x86_64.zip"
checksum_asset = "SHA256SUMS"

[sources.macos-aarch64]
type = "github"
repo = "Krifmaz/Cadenza"
asset = "Cadenza-Desktop-{version}-macos-aarch64.tar.gz"
checksum_asset = "SHA256SUMS"

[install]
bin = ["cadenza-desktop"]
executable = "cadenza-desktop"

[install.windows]
bin = ["Cadenza.exe"]
executable = "Cadenza.exe"

[install.macos]
app_bundle = "Cadenza.app"

[[shortcuts]]
name = "Cadenza"
comment = "Upsampling audio engine and player"
categories = ["AudioVideo", "Audio", "Player"]
